spring.application.name=game-service
server.port=8051
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/game_db}
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
service.level.url=${LEVEL_SERVICE_URL:http://level-service:8052}
service.scenario.url=${SCENARIO_SERVICE_URL:http://scenario-service:8053}
service.answer.url=${ANSWER_SERVICE_URL:http://answer-service:8054}
service.score.url=${SCORE_SERVICE_URL:http://score-service:8055}
service.feedback.url=${FEEDBACK_SERVICE_URL:http://feedback-service:8056}
service.user.url=${USER_SERVICE_URL:http://user-service:8050}

# Shared secret for service-to-service calls. Override in every environment.
internal.api-key=${INTERNAL_API_KEY:mindhack-dev-internal-key}
