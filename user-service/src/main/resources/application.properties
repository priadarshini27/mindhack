spring.application.name=user-service
server.port=8050

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/user_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

logging.level.com.mindhack=INFO

# Shared secret for service-to-service calls. Override in every environment.
internal.api-key=${INTERNAL_API_KEY:mindhack-dev-internal-key}
