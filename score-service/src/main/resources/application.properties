spring.application.name=score-service
server.port=8055

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/score_db}
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Shared secret for service-to-service calls. Override in every environment.
internal.api-key=${INTERNAL_API_KEY:mindhack-dev-internal-key}
