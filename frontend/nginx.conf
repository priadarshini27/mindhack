server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths (e.g. /dashboard on refresh) serve index.html
    # so React Router can handle them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
